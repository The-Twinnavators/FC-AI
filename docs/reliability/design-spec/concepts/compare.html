<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Home concepts</title>
<style>
  body { margin: 0; padding: 24px 16px; background: #f4f4f2; color: #1a1a1a; font: 14px/1.4 system-ui, sans-serif; }
  .row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; align-items: start; }
  figure { margin: 0; display: grid; gap: 8px; }
  figcaption strong { display: block; font-size: 15px; }
  figcaption span { color: #555; }
  img { width: 100%; border: 1px solid #d0d0cc; border-radius: 8px; background: #fff; }
  @media (max-width: 900px) { .row { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="row">
  <figure>
    <figcaption><strong>Editorial: your magazine page</strong><span>Sticky side column (search, sections, most liked, saved), cover story, section tiles, feed. Playfair Display / Literata, warm paper, flat.</span></figcaption>
    <img src="concept-editorial.png" alt="Clean Cart Home in the magazine design">
  </figure>
  <figure>
    <figcaption><strong>Market hall: your storefront page</strong><span>Promo banner, search, category tabs over a four-column product grid. Fraunces / Work Sans, fresh green, soft corners.</span></figcaption>
    <img src="concept-market.png" alt="Clean Cart Home in the storefront design">
  </figure>
  <figure>
    <figcaption><strong>Bold aisle: your listings page</strong><span>Search hero with category, proof points, sortable listings, stores, ZIP. Oswald / DM Sans, yellow, neo-brutalist.</span></figcaption>
    <img src="concept-bold.png" alt="Clean Cart Home in the listings design">
  </figure>
</div>
</body>
</html>
